name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
    - name: Limpiar espacio y actualizar servidor
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

    - name: Descargar el código fuente de mi Fork
      uses: actions/checkout@v4

    - name: Descargar Compilador (Clang de Google)
      run: |
        # Usar Clang 11, compatible con kernels 4.14
        CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902b.tar.gz"
        wget --no-verbose "$CLANG_URL" -O clang.tar.gz
        mkdir -p clone-clang
        tar -xzf clang.tar.gz -C clone-clang
        echo "COMPILER_PATH=$GITHUB_WORKSPACE/clone-clang/bin" >> $GITHUB_ENV
  
    - name: Verificar compilador
      run: |
        export PATH="$GITHUB_WORKSPACE/clone-clang/bin:$PATH"
        echo "--- Versión de Clang ---"
        clang --version
        echo "--- Prueba de bandera -fstack-protector-strong ---"
        echo 'int main(void){return 0;}' > test.c
        clang -fstack-protector-strong -c test.c -o test.o && echo "Bandera SOPORTADA" || echo "Bandera NO SOPORTADA"

    - name: Compilar Kernel (MediaTek MT6785)
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="$GITHUB_WORKSPACE/clone-clang/bin:$PATH"
        
        make O=out rosemary_defconfig
        # Deshabilitar la opción que causa el conflicto inicial
        ./scripts/config --file out/.config -d CC_STACKPROTECTOR_STRONG
        
        # Usar LLVM=1 para forzar todo el toolchain de LLVM
        make -j$(nproc --all) O=out \
          LLVM=1 \
          KCFLAGS="-Wno-error" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
    - name: Empaquetar Imagen del Kernel
      run: |
        cd out/arch/arm64/boot/
        zip -r ../../../../kernel-rosemary-final.zip Image.gz-dtb || zip -r ../../../../kernel-rosemary-final.zip Image
        
    - name: Subir el Kernel Compilador a Releases
      uses: softprops/action-gh-release@v2
      with:
        files: kernel-rosemary-final.zip
        tag_name: kernel-${{ github.run_number }}
        name: Compilación Exitosa #${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
