name: Compilar Kernel Local

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Descargar el código fuente de mi Fork
        uses: actions/checkout@v4

      - name: Compilar Kernel de Android

        uses: UtsavBalaji/Android-Kernel-Build-Action@main
        with:
          kernel-url: . 
          arch: arm64
          defconfig: rosemary_defconfig 
          android-version: 12
          aosp-clang: true
          anykernel3: true
          release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
